services:
  passwordvault:
    build: .
    ports:
      - "8080:8080"
    environment:
      PASSWORDVAULT_HOST: 0.0.0.0
      PASSWORDVAULT_PORT: 8080
      PASSWORDVAULT_DB: /data/vault.db
      PASSWORDVAULT_UPLOAD_DIR: /data/uploads
      PASSWORDVAULT_COOKIE_SECURE: "true"
      PASSWORDVAULT_ENFORCE_HTTPS: "false"
      PASSWORDVAULT_CSRF_SECRET: ${PASSWORDVAULT_CSRF_SECRET}
      PASSWORDVAULT_LOGIN_MAX: "5"
      PASSWORDVAULT_AUTOLOCK: "5"
      PASSWORDVAULT_MIN_STRENGTH: "2"
    volumes:
      - vault-data:/data
    restart: unless-stopped

volumes:
  vault-data:
